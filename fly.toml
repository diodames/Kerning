# fly launch --copy-config
# Secrets: fly secrets set SECRET_KEY=... RESEND_API_KEY=... MAIL_FROM=...
# Postgres: fly postgres create && fly postgres attach
# Keep the worker up: fly scale count worker=1
#
# Two processes: web (HTTP) and worker (shared crawl + per-user cuts).

app = "kerning"
primary_region = "ams"

[build]

[env]
  APP_ORIGIN = "https://kerning.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m app.worker"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

[[restart]]
  policy = "always"
  processes = ["worker"]
