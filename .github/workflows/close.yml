name: Close day

on:
  schedule:
    - cron: "15 23 * * *"
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Prague calendar day YYYY-MM-DD (empty = yesterday)
        required: false
        default: ""
      force:
        description: Rewrite a closed day
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: kerning-data
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests feedparser

      - name: Check out the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git worktree add state FETCH_HEAD
          else
            git worktree add --orphan -b data state
          fi

      - name: Close Prague day
        env:
          KERNING_DATA_DIR: ${{ github.workspace }}/state
          DIGEST_TZ: Europe/Prague
          DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          args=(--close)
          if [ -n "${DATE:-}" ]; then args+=(--date "$DATE"); fi
          if [ "${FORCE:-false}" = "true" ]; then args+=(--force); fi
          python kerning_fetch.py "${args[@]}"

      - name: Commit
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -qm "Close $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data
